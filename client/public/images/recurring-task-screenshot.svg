<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="#1e1e2e" rx="8" ry="8"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="240" height="450" fill="#181825" rx="0" ry="0"/>
  
  <!-- Sidebar Logo -->
  <g transform="translate(20, 25)">
    <rect x="0" y="0" width="30" height="30" rx="6" ry="6" fill="#e91e63"/>
    <text x="40" y="20" font-family="Arial" font-size="20" font-weight="bold" fill="#ffffff">OnePage</text>
  </g>
  
  <!-- Sidebar Menu Items -->
  <g transform="translate(20, 80)">
    <text x="40" y="25" font-family="Arial" font-size="14" fill="#94a3b8">Tasks</text>
    
    <rect x="0" y="50" width="200" height="40" rx="6" ry="6" fill="#e91e63" opacity="0.2"/>
    <text x="40" y="75" font-family="Arial" font-size="14" fill="#ffffff">Repeating Tasks</text>
    
    <text x="40" y="125" font-family="Arial" font-size="14" fill="#94a3b8">Archive</text>
    <text x="40" y="175" font-family="Arial" font-size="14" fill="#94a3b8">About</text>
    <text x="40" y="225" font-family="Arial" font-size="14" fill="#94a3b8">Contact</text>
  </g>
  
  <!-- User Profile -->
  <g transform="translate(20, 400)">
    <circle cx="15" cy="15" r="15" fill="#334155"/>
    <text x="40" y="20" font-family="Arial" font-size="14" fill="#ffffff">riley.a.trottier@gmail.com</text>
  </g>
  
  <!-- Main Content -->
  <g transform="translate(260, 20)">
    <!-- Header -->
    <text x="0" y="30" font-family="Arial" font-size="24" font-weight="bold" fill="#ffffff">Repeating Tasks</text>
    
    <!-- Table Header -->
    <rect x="0" y="50" width="520" height="50" rx="6" ry="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="90" x2="520" y2="90" stroke="#334155" stroke-width="1"/>
    
    <text x="20" y="75" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">Task</text>
    <text x="280" y="75" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">Frequency</text>
    <text x="380" y="75" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">Category</text>
    <text x="480" y="75" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">Actions</text>
    
    <!-- Table Rows -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="520" height="60" rx="0" ry="0" fill="#262636" stroke="#334155" stroke-width="1"/>
      <text x="20" y="35" font-family="Arial" font-size="14" fill="#ffffff">Follow up with client about project status</text>
      <text x="280" y="35" font-family="Arial" font-size="14" fill="#ffffff">Weekly</text>
      <text x="380" y="35" font-family="Arial" font-size="14" fill="#ffffff">Work</text>
      <circle cx="480" cy="30" r="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="480" y="35" font-family="Arial" font-size="14" fill="#94a3b8" text-anchor="middle">···</text>
    </g>
    
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="520" height="60" rx="0" ry="0" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
      <text x="20" y="35" font-family="Arial" font-size="14" fill="#ffffff">Update team on project progress</text>
      <text x="280" y="35" font-family="Arial" font-size="14" fill="#ffffff">Daily</text>
      <text x="380" y="35" font-family="Arial" font-size="14" fill="#ffffff">Work</text>
      <circle cx="480" cy="30" r="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="480" y="35" font-family="Arial" font-size="14" fill="#94a3b8" text-anchor="middle">···</text>
    </g>
    
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="520" height="60" rx="0" ry="0" fill="#262636" stroke="#334155" stroke-width="1"/>
      <text x="20" y="35" font-family="Arial" font-size="14" fill="#ffffff">Journal</text>
      <text x="280" y="35" font-family="Arial" font-size="14" fill="#ffffff">Daily</text>
      <text x="380" y="35" font-family="Arial" font-size="14" fill="#ffffff">Personal</text>
      <circle cx="480" cy="30" r="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="480" y="35" font-family="Arial" font-size="14" fill="#94a3b8" text-anchor="middle">···</text>
    </g>
    
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="520" height="60" rx="0" ry="0" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
      <text x="20" y="35" font-family="Arial" font-size="14" fill="#ffffff">Review monthly budget</text>
      <text x="280" y="35" font-family="Arial" font-size="14" fill="#ffffff">Monthly</text>
      <text x="380" y="35" font-family="Arial" font-size="14" fill="#ffffff">Finance</text>
      <circle cx="480" cy="30" r="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="480" y="35" font-family="Arial" font-size="14" fill="#94a3b8" text-anchor="middle">···</text>
    </g>
    
    <g transform="translate(0, 340)">
      <rect x="0" y="0" width="520" height="60" rx="0" ry="0" fill="#262636" stroke="#334155" stroke-width="1"/>
      <text x="20" y="35" font-family="Arial" font-size="14" fill="#ffffff">Backup important files</text>
      <text x="280" y="35" font-family="Arial" font-size="14" fill="#ffffff">Quarterly</text>
      <text x="380" y="35" font-family="Arial" font-size="14" fill="#ffffff">Tech</text>
      <circle cx="480" cy="30" r="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="480" y="35" font-family="Arial" font-size="14" fill="#94a3b8" text-anchor="middle">···</text>
    </g>
  </g>
</svg>