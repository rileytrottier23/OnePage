<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="#1e1e2e" rx="8" ry="8"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="240" height="450" fill="#181825" rx="0" ry="0"/>
  
  <!-- Sidebar Logo -->
  <g transform="translate(20, 25)">
    <rect x="0" y="0" width="30" height="30" rx="6" ry="6" fill="#e91e63"/>
    <text x="40" y="20" font-family="Arial" font-size="20" font-weight="bold" fill="#ffffff">OnePage</text>
  </g>
  
  <!-- Sidebar Menu Items -->
  <g transform="translate(20, 80)">
    <rect x="0" y="0" width="200" height="40" rx="6" ry="6" fill="#e91e63" opacity="0.2"/>
    <text x="40" y="25" font-family="Arial" font-size="14" fill="#ffffff">Tasks</text>
    
    <text x="40" y="75" font-family="Arial" font-size="14" fill="#94a3b8">Repeating Tasks</text>
    <text x="40" y="125" font-family="Arial" font-size="14" fill="#94a3b8">Archive</text>
    <text x="40" y="175" font-family="Arial" font-size="14" fill="#94a3b8">About</text>
    <text x="40" y="225" font-family="Arial" font-size="14" fill="#94a3b8">Contact</text>
  </g>
  
  <!-- User Profile -->
  <g transform="translate(20, 400)">
    <circle cx="15" cy="15" r="15" fill="#334155"/>
    <text x="40" y="20" font-family="Arial" font-size="14" fill="#ffffff">riley.a.trottier@gmail.com</text>
  </g>
  
  <!-- Main Content -->
  <g transform="translate(260, 20)">
    <!-- Header -->
    <text x="0" y="30" font-family="Arial" font-size="24" font-weight="bold" fill="#ffffff">Tasks</text>
    
    <!-- Today Section -->
    <rect x="0" y="50" width="520" height="40" rx="6" ry="6" fill="#e91e63" opacity="0.1"/>
    <text x="10" y="75" font-family="Arial" font-size="16" font-weight="bold" fill="#e91e63">Today</text>
    
    <!-- Today Tasks -->
    <g transform="translate(10, 100)">
      <rect x="0" y="0" width="500" height="40" rx="4" ry="4" fill="#262636" stroke="#303048" stroke-width="1"/>
      <circle cx="20" cy="20" r="8" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <text x="40" y="25" font-family="Arial" font-size="14" fill="#ffffff">Follow up with client about project timeline</text>
      <text x="420" y="25" font-family="Arial" font-size="12" fill="#94a3b8">Work</text>
    </g>
    
    <g transform="translate(10, 150)">
      <rect x="0" y="0" width="500" height="40" rx="4" ry="4" fill="#262636" stroke="#303048" stroke-width="1"/>
      <circle cx="20" cy="20" r="8" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <text x="40" y="25" font-family="Arial" font-size="14" fill="#ffffff">Schedule dentist appointment</text>
      <text x="420" y="25" font-family="Arial" font-size="12" fill="#94a3b8">Personal</text>
    </g>
    
    <!-- Work Category -->
    <rect x="0" y="210" width="520" height="40" rx="6" ry="6" fill="#475569" opacity="0.2"/>
    <text x="10" y="235" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">Work</text>
    
    <!-- Work Tasks -->
    <g transform="translate(10, 260)">
      <rect x="0" y="0" width="500" height="40" rx="4" ry="4" fill="#262636" stroke="#303048" stroke-width="1"/>
      <circle cx="20" cy="20" r="8" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <text x="40" y="25" font-family="Arial" font-size="14" fill="#ffffff">Update project documentation</text>
    </g>
    
    <g transform="translate(10, 310)">
      <rect x="0" y="0" width="500" height="40" rx="4" ry="4" fill="#262636" stroke="#303048" stroke-width="1"/>
      <circle cx="20" cy="20" r="8" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <text x="40" y="25" font-family="Arial" font-size="14" fill="#ffffff">Review pull requests</text>
    </g>
    
    <!-- Personal Category -->
    <rect x="0" y="370" width="520" height="40" rx="6" ry="6" fill="#475569" opacity="0.2"/>
    <text x="10" y="395" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">Personal</text>
    
    <!-- Personal Tasks -->
    <g transform="translate(30, 420)">
      <rect x="0" y="0" width="480" height="40" rx="4" ry="4" fill="#262636" stroke="#303048" stroke-width="1"/>
      <circle cx="20" cy="20" r="8" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <text x="40" y="25" font-family="Arial" font-size="14" fill="#ffffff">Buy groceries</text>
    </g>
  </g>
</svg>