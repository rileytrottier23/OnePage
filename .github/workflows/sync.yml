name: Sync from Replit

on:
  repository_dispatch:
    types: [replit-deploy]
  workflow_dispatch:

jobs:
  verify-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Pin the Node version explicitly.
      #
      # Without this the job silently inherits whatever the GitHub runner
      # currently defaults to. That default moved to Node 24, while this project
      # is developed on Replit under Node 20 and its lockfile was generated by
      # npm 10.8.2 - so `npm ci` began crashing with "Exit handler never called!"
      # even though nothing in the repo had changed.
      #
      # Keep this aligned with the Replit container. If you upgrade one, upgrade
      # both, and regenerate package-lock.json on the new version.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify commit matches deployed SHA
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "HEAD on GitHub: ${CURRENT_SHA}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            EXPECTED_SHA="${{ github.event.client_payload.sha }}"
            echo "Expected SHA from Replit deploy: ${EXPECTED_SHA}"
            if [ "${CURRENT_SHA}" = "${EXPECTED_SHA}" ]; then
              echo "OK: GitHub is in sync with Replit."
            else
              echo "MISMATCH: GitHub HEAD (${CURRENT_SHA}) does not match deployed SHA (${EXPECTED_SHA})."
              exit 1
            fi
          else
            echo "Manually triggered. Current HEAD: ${CURRENT_SHA}"
          fi

      # NODE_ENV is deliberately NOT set to production here.
      #
      # npm treats NODE_ENV=production as --omit=dev, so setting it on the
      # install step skips devDependencies - which is where vite, esbuild and
      # typescript live. The install would appear to succeed and the build would
      # then fail on missing tooling. Install everything, build in production.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Confirm build artifact exists
        run: |
          if [ ! -f dist/index.js ]; then
            echo "ERROR: dist/index.js not found after build."
            exit 1
          fi
          echo "Build artifact confirmed: dist/index.js exists."
